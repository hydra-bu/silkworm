name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check silkworm/ tests/

      - name: Debug environment
        run: |
          uv run python --version
          uv run python -c "import sys; print(sys.path)"
          uv run python -c "import pytest; print('pytest', pytest.__version__)"
          uv run python -c "import pytest_asyncio; print('pytest-asyncio', pytest_asyncio.__version__)"
          ls -la tests/

      - name: Test with pytest
        run: uv run pytest -v --tb=long --cov=silkworm --cov-report=xml --cov-report=term 2>&1

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: silkworm-wheel
          path: dist/*.whl
